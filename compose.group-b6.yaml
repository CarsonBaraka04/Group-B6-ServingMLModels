
services:

  # Group B6 Flask API served by Gunicorn
  api:
    build:
      context: .
      dockerfile: Dockerfile.group-b6
    image: group-b6-ml-api:local
    expose:
      - "5000"
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/group-b6.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
